# Local development: Postgres and Mailpit on this machine's loopback (bun run infra:up).
services:
    db:
        ports:
            - '127.0.0.1:${POSTGRES_PORT:-5434}:5432'
    mailpit:
        image: axllent/mailpit:v1.32.0
        restart: unless-stopped
        ports:
            - '127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025'
            - '127.0.0.1:${MAILPIT_WEB_PORT:-8025}:8025'
    web:
        environment:
            SMTP_HOST: mailpit
            SMTP_PORT: 1025
