name: CI

on:
    push:
        branches: [main]
    pull_request:

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    check:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        services:
            postgres:
                image: postgres:18-alpine
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: postgres
                ports: ['5432:5432']
                options: >-
                    --health-cmd "pg_isready -U postgres"
                    --health-interval 5s --health-timeout 5s --health-retries 10
            mailpit:
                image: axllent/mailpit:v1.32.0
                ports: ['1025:1025', '8025:8025']
        env:
            APP_ORIGIN: http://localhost:5173
            PORT: 5173
            DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
            BETTER_AUTH_SECRET: ci-secret-that-is-only-used-in-continuous-integration
            EMAIL_ADAPTER: smtp
            EMAIL_FROM: App <hello@app.test>
            SMTP_HOST: 127.0.0.1
            SMTP_PORT: 1025
            SMTP_SECURE: 'false'
            SMTP_REQUIRE_TLS: 'false'
            MAILPIT_WEB_PORT: 8025
        steps:
            - uses: actions/checkout@v5
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version-file: package.json
            - run: bun install --frozen-lockfile
            # The scripts read .env; in CI everything comes from the job's environment.
            - run: touch .env
            - run: bun run format:check
            - run: bun run lint
            - run: bun run typecheck
            - run: bun run db:migrate
            - run: bun run test
            - run: NODE_ENV=production bun run build
            - run: bunx playwright install --with-deps chromium
            - run: bun run e2e
            - uses: actions/upload-artifact@v4
              if: failure()
              with:
                  name: playwright-report
                  path: playwright-report
                  retention-days: 7
